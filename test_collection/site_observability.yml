---
- name: Provision Observability infrastructure in Yandex Cloud
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    yc_zone: "ru-central1-d"
    yc_subnet: "default-ru-central1-d"
    yc_ssh_key: "~/.ssh/id_ed25519.pub"
    yc_ssh_user: "yc-user"
    yc_preemptible: true
    vm_specs:
      - name: "clickhouse-01"
        group: "clickhouse"
        cores: 2
        core_fraction: 50
        memory: 4
        disk_size: 20
      - name: "vector-01"
        group: "vector"
        cores: 2
        core_fraction: 50
        memory: 2
        disk_size: 15
      - name: "lighthouse-01"
        group: "lighthouse"
        cores: 2
        core_fraction: 50
        memory: 2
        disk_size: 15

  tasks:
    - name: Create VMs in Yandex Cloud via yc_instance module
      my_own_namespace.yandex_cloud_elk.yc_instance:
        name: "{{ item.name }}"
        zone: "{{ yc_zone }}"
        cores: "{{ item.cores }}"
        core_fraction: "{{ item.core_fraction | default(50) }}"
        memory: "{{ item.memory }}"
        disk_size: "{{ item.disk_size }}"
        image_family: "ubuntu-2204-lts"
        subnet_name: "{{ yc_subnet }}"
        nat: true
        preemptible: "{{ yc_preemptible }}"
        ssh_key_path: "{{ yc_ssh_key }}"
      loop: "{{ vm_specs }}"
      register: created_vms

    - name: Add provisioned VMs to dynamic inventory
      ansible.builtin.add_host:
        name: "{{ item.item.name }}"
        groups:
          - "{{ item.item.group }}"
          - "yc_observability"
        ansible_host: "{{ item.public_ip }}"
        ansible_user: "{{ yc_ssh_user }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
        private_ip: "{{ item.private_ip }}"
      loop: "{{ created_vms.results }}"

    - name: Save generated inventory file to disk for reference
      ansible.builtin.copy:
        dest: "./generated_inventory.yml"
        mode: "0644"
        content: |
          ---
          all:
            children:
          {% for res in created_vms.results %}
              {{ res.item.group }}:
                hosts:
                  {{ res.item.name }}:
                    ansible_host: {{ res.public_ip }}
                    private_ip: {{ res.private_ip }}
                    ansible_user: {{ yc_ssh_user }}
          {% endfor %}

- name: Wait for SSH on provisioned hosts
  hosts: yc_observability
  gather_facts: false
  tasks:
    - name: Wait for connection
      ansible.builtin.wait_for_connection:
        delay: 15
        sleep: 5
        timeout: 360

- name: Deploy and configure ClickHouse
  hosts: clickhouse
  become: true
  roles:
    - role: my_own_namespace.yandex_cloud_elk.clickhouse

- name: Deploy and configure Vector
  hosts: vector
  become: true
  vars:
    clickhouse_host: "{{ hostvars[groups['clickhouse'][0]]['private_ip'] }}"
  roles:
    - role: my_own_namespace.yandex_cloud_elk.vector_role

- name: Deploy and configure Lighthouse
  hosts: lighthouse
  become: true
  vars:
    clickhouse_host: "{{ hostvars[groups['clickhouse'][0]]['public_ip'] }}"
  roles:
    - role: my_own_namespace.yandex_cloud_elk.lighthouse_role
